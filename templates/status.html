<section class="status-check">

    <h2>Check Admission Status</h2>

    <p class="status-subtitle">
        Enter your registered phone number
    </p>

    <form action="/check-status" method="POST">

        <input
        type="text"
        name="phone"
        placeholder="Enter Registered Phone Number"
        required>

        <button type="submit">
            Check Status
        </button>

    </form>

</section>
