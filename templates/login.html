<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        body{
            background:#0b0f19;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Poppins,sans-serif;
        }

        .login-box{
            background:#111827;
            padding:40px;
            border-radius:20px;
            width:350px;
            text-align:center;
        }

        h2{
            color:white;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4ade80;
            border:none;
            border-radius:10px;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        .login-box{
    background:rgba(17,24,39,.95);

    padding:45px;

    border-radius:25px;

    width:380px;

    text-align:center;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}

.subtitle{
    color:#9ca3af;
    margin-bottom:20px;
}

.home-btn{
    display:inline-block;

    margin-bottom:25px;

    text-decoration:none;

    color:#86efac;

    font-weight:600;
}

input{
    width:100%;

    padding:14px;

    margin:10px 0;

    border:1px solid #374151;

    border-radius:12px;

    background:#0b1220;

    color:white;
}

input:focus{
    outline:none;

    border-color:#4ade80;

    box-shadow:0 0 15px rgba(74,222,128,.3);
}

button{
    width:100%;

    padding:14px;

    margin-top:10px;

    background:#4ade80;

    border:none;

    border-radius:12px;

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}
h2{
    color:white;
    margin-bottom:15px;

    text-shadow:
    0 0 20px rgba(74,222,128,.3);
}
button:hover{
    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(74,222,128,.35);
}
.home-btn:hover{
    color:white;
}

    </style>

</head>

<body>

<div class="login-box">

    <h2>🔐 Admin Login</h2>

    <p class="subtitle">
        Secure Access Panel
    </p>

    <a href="/" class="home-btn">
        🏠 Back To Website
    </a>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            🚀 Login
        </button>

    </form>

</div>

</body>

</html>
